<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Decimal to Binary Converter</title>
</head>
<body>
    <div class="container">
        <h2>Decimal to Binary</h2>
        <div class="input">
            <h4>Number to Convert</h4>
            <input type="number" id="to_convert">
            <button id="Binary_convert" onclick="convert()">Convert</button>
            <div class="input">
                <h4 id="into">Result</h4>
                <input type="text" id="result" readonly>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
